[package]
name = "aem-log-analyzer"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Group live AEM as a Cloud Service error-log events"
publish = false
default-run = "aemlog"

[[bin]]
name = "aemlog"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
regex = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
serde_json = "1"
